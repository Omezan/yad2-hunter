name: Yad2 Scan

on:
  schedule:
    # One job per hour. GitHub's scheduler is observably unreliable for
    # short cron intervals (free-tier accounts can see */30 slip to
    # 60–240 min gaps under platform load), so we book a single runner
    # per hour and let the job itself drive scan cadence via an
    # internal loop — see src/worker/run-loop.js. Effective scan
    # frequency: ~every 30 minutes.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: yad2-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Restore state from state branch
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state --depth=1
            git --work-tree=state checkout origin/state -- .
            echo "Restored state from origin/state"
          else
            echo "No state branch yet, starting fresh"
          fi

      - name: Run scan loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFICATIONS_ENABLED: "true"
          # SMTP transport for the Lev HaPark watch — see scan-once.yml.
          # When secrets are unset, the email service skips gracefully.
          EMAIL_NOTIFICATIONS_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          PLAYWRIGHT_HEADLESS: "true"
          STATE_DIR: ${{ github.workspace }}/state
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # 55 minutes wall-clock budget so the loop finishes before
          # the next hourly tick can collide on the concurrency group.
          LOOP_BUDGET_MS: "3300000"
          # Scan every 30 min within the budget. With a ~55-min budget
          # this gives us 2 iterations per job (≈minute 0 and ≈minute
          # 30), independent of GitHub's scheduler.
          LOOP_INTERVAL_MS: "1800000"
          # Persist seen-ads + runs after every iteration so a crash
          # between iterations doesn't lose what we already discovered.
          LOOP_PERSIST_EACH_ITERATION: "true"
        run: npm run scan:loop

      - name: Persist final state to state branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: ${{ github.workspace }}/state
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/persist-state.sh
